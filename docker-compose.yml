services:
  postgres:
    image: postgres:15-alpine
    container_name: tam_db
    environment:
      POSTGRES_DB: ${DB_NAME:-tam_db}
      POSTGRES_USER: ${DB_USER:-tam_admin}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?ERROR: DB_PASSWORD must be set in .env}"
      TZ: ${TZ:-Asia/Shanghai}
    ports: []
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=4MB
        -c effective_cache_size=768MB
        -c wal_level=replica
        -c max_connections=100
        -c random_page_cost=1.1
        -c log_min_duration_statement=1000
        -c log_connections=on
        -c log_disconnections=on
        -c log_line_prefix='%t [%p] %u@%d '
        -c log_timezone=${TZ:-Asia/Shanghai}
        -c timezone=${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tam_admin} -d tam_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tam_network

  redis:
    image: redis:7-alpine
    container_name: tam_redis
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: "redis-server --requirepass '${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set in .env}' --appendonly yes --appendfsync everysec"
    ports: []
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tam_network

  backend:
    build: ./backend
    container_name: tam_backend
    ports:
      - "127.0.0.1:${TAM_BACKEND_PORT:-8000}:${TAM_BACKEND_PORT:-8000}"
    environment:
      # Core
      PROJECT_NAME: ${PROJECT_NAME:-Terminal Access Platform}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      VERSION: "${VERSION}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Asia/Shanghai}
      # Database (URL constructed from DB_* to keep password in sync with postgres container)
      DATABASE_URL: "postgresql+asyncpg://${DB_USER:-tam_admin}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-tam_db}"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-tam_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-tam_db}
      # Redis (URL constructed from REDIS_PASSWORD to keep in sync with redis container)
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Security
      SECRET_KEY: "${SECRET_KEY:?ERROR: SECRET_KEY must be set in .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Lockout / CAPTCHA
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES:-15}
      CAPTCHA_THRESHOLD: ${CAPTCHA_THRESHOLD:-3}
      # Registration / Rate limit
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-5}
      # Integrations: Sangfor
      SANGFOR_BASE_URL: ${SANGFOR_BASE_URL}
      SANGFOR_USERNAME: ${SANGFOR_USERNAME}
      SANGFOR_PASSWORD: ${SANGFOR_PASSWORD}
      SANGFOR_CA_BUNDLE: ${SANGFOR_CA_BUNDLE}
      # Integrations: Switch
      SWITCH_HOST: ${SWITCH_HOST}
      SWITCH_USERNAME: ${SWITCH_USERNAME}
      SWITCH_PASSWORD: ${SWITCH_PASSWORD}
      SWITCH_PORT: ${SWITCH_PORT:-23}
      # Integrations: IPGuard
      IPGUARD_HOST: ${IPGUARD_HOST}
      IPGUARD_USER: ${IPGUARD_USER}
      IPGUARD_PASSWORD: ${IPGUARD_PASSWORD}
      IPGUARD_DATABASE: ${IPGUARD_DATABASE:-OCULAR3}
      # CORS / Admin / Paths / Port
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-[]}'
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      BACKEND_PORT: ${TAM_BACKEND_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tam_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; port = os.environ.get('BACKEND_PORT','8000'); urllib.request.urlopen(f'http://localhost:{port}/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - backend-logs:/var/log/tam
      - backend-data:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VERSION: ${VERSION}
    container_name: tam_frontend
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - frontend_dist:/app/dist
    networks:
      - tam_network
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: tam_nginx
    # Use host network mode to preserve real client IP
    # Docker NAT replaces client IP with bridge gateway (172.x.x.x),
    # host mode allows Nginx to see the actual source IP directly
    network_mode: host
    entrypoint: ["/docker-entrypoint.sh"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      TAM_NGINX_PORT: ${TAM_NGINX_PORT:-8080}
      TAM_NGINX_SSL_PORT: ${TAM_NGINX_SSL_PORT:-8443}
      TAM_BACKEND_PORT: ${TAM_BACKEND_PORT:-8000}
    volumes:
      - ./nginx/etc/conf.d/tam.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./nginx/certs:/etc/nginx/ssl:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --no-check-certificate https://localhost:${TAM_NGINX_SSL_PORT:-8443}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    tmpfs:
      - /var/cache/nginx
      - /var/run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  frontend_dist:
  backend-logs:
  backend-data:

networks:
  tam_network:
    driver: bridge
