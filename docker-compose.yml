services:
  postgres:
    image: postgres:15-alpine
    container_name: tam_db
    environment:
      POSTGRES_DB: tam_db
      POSTGRES_USER: ${DB_USER:-tam_admin}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?ERROR: DB_PASSWORD must be set in .env}"
      TZ: ${TZ:-Asia/Shanghai}
    ports: []
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=4MB
        -c effective_cache_size=768MB
        -c wal_level=replica
        -c max_connections=100
        -c random_page_cost=1.1
        -c log_min_duration_statement=1000
        -c log_connections=on
        -c log_disconnections=on
        -c log_line_prefix='%t [%p] %u@%d '
        -c log_timezone=${TZ:-Asia/Shanghai}
        -c timezone=${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tam_admin} -d tam_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    # Production hardening (uncomment for production):
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
    tmpfs:
      - /var/run/postgresql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tam_network

  redis:
    image: redis:7-alpine
    container_name: tam_redis
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: "redis-server --requirepass '${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set in .env}' --appendonly yes --appendfsync everysec"
    ports: []
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    # Production hardening (uncomment for production):
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tam_network

  backend:
    build: ./backend
    container_name: tam_backend
    ports: []
    environment:
      DATABASE_URL: "postgresql+asyncpg://${DB_USER:-tam_admin}:${DB_PASSWORD}@postgres:5432/tam_db"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:?ERROR: SECRET_KEY must be set in .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      SANGFOR_BASE_URL: ${SANGFOR_BASE_URL}
      SANGFOR_USERNAME: ${SANGFOR_USERNAME}
      SANGFOR_PASSWORD: ${SANGFOR_PASSWORD}
      SWITCH_HOST: ${SWITCH_HOST}
      SWITCH_USERNAME: ${SWITCH_USERNAME}
      SWITCH_PASSWORD: ${SWITCH_PASSWORD}
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-[]}'
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tam_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # Production hardening (uncomment for production):
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
    # read_only: true
    tmpfs:
      - /tmp
      - /app/uploads
    volumes:
      - tam-logs:/var/log/tam
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build: ./frontend
    container_name: tam_frontend
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - frontend_dist:/app/dist
    networks:
      - tam_network
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # Production hardening (uncomment for production):
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: tam_nginx
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./nginx/etc/conf.d/tam.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/ssl:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - tam_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    # Production hardening (uncomment for production):
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - NET_BIND_SERVICE
    # read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  frontend_dist:
  tam-logs:

networks:
  tam_network:
    driver: bridge
