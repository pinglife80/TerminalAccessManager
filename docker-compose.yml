services:
  postgres:
    image: postgres:15-alpine
    container_name: mac_security_db
    environment:
      POSTGRES_DB: mac_security
      POSTGRES_USER: ${DB_USER:-mac_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports: []
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mac_admin} -d mac_security"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mac_security_network

  redis:
    image: redis:7-alpine
    container_name: mac_security_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports: []
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mac_security_network

  backend:
    build: ./backend
    container_name: mac_security_backend
    ports: []
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mac_admin}:${DB_PASSWORD:-password}@postgres:5432/mac_security
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      SANGFOR_BASE_URL: ${SANGFOR_BASE_URL}
      SANGFOR_USERNAME: ${SANGFOR_USERNAME}
      SANGFOR_PASSWORD: ${SANGFOR_PASSWORD}
      SWITCH_HOST: ${SWITCH_HOST}
      SWITCH_USERNAME: ${SWITCH_USERNAME}
      SWITCH_PASSWORD: ${SWITCH_PASSWORD}
      BACKEND_CORS_ORIGINS: '["http://localhost", "http://localhost:80"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mac_security_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: mac_security_frontend
    volumes:
      - frontend_dist:/app/dist
    networks:
      - mac_security_network
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: mac_security_nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/etc/conf.d/mac_security.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/ssl:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mac_security_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_dist:

networks:
  mac_security_network:
    driver: bridge
