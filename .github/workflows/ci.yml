name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ==================== Backend Jobs ====================
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Run ruff check
        run: ruff check app/ tests/

  backend-test:
    name: Backend Test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: "ci-test-secret-key-at-least-32-characters-long"
          ENCRYPTION_KEY: "ci-test-encryption-key-at-least-32-characters-long"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          DB_PASSWORD: "ci_test_password"
        run: python -m pytest tests/ -v --tb=short --cov-fail-under=20

  backend-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image with retries
        run: |
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "Attempt $attempt of $max_attempts..."
            if docker build -t tam-backend:ci ./backend; then
              echo "Build successful"
              exit 0
            fi
            if [ $attempt -lt $max_attempts ]; then
              echo "Build failed, waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          echo "Build failed after $max_attempts attempts"
          exit 1

  # ==================== Frontend Jobs ====================
  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install
      - name: Run ESLint
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 25

  frontend-test:
    name: Frontend Test (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install
      - name: Run tests
        run: npx vitest run --reporter=verbose

  frontend-build:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image with retries
        run: |
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "Attempt $attempt of $max_attempts..."
            if docker build -t tam-frontend:ci ./frontend; then
              echo "Build successful"
              exit 0
            fi
            if [ $attempt -lt $max_attempts ]; then
              echo "Build failed, waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          echo "Build failed after $max_attempts attempts"
          exit 1
